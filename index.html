<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>പയ്യമ്പള്ളി മേഖല - കലാമത്സരം 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Manjari:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            ml: ['Manjari', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          animation: {
            'float-slow': 'float 5s ease-in-out infinite',
            'spin-slow': 'spin 12s linear infinite',
            'shimmer': 'shimmer 2.5s infinite linear',
            'pulse-glow': 'pulseGlow 2s infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' }
            },
            pulseGlow: {
              '0%': { boxShadow: '0 0 20px rgba(245, 158, 11, 0.2)' },
              '100%': { boxShadow: '0 0 50px rgba(245, 158, 11, 0.6)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      overflow: hidden;
    }

    /* Holy Divine Aura Background */
    .god-ray {
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.22) 0%, rgba(217, 119, 6, 0.08) 40%, rgba(3, 7, 18, 1) 80%);
    }

    /* Glassmorphism Styling */
    .divine-glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Metallic Golden Text Gradient */
    .gold-gradient-text {
      background: linear-gradient(135deg, #fffbeb 0%, #fde047 30%, #d97706 70%, #fef08a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Shimmer Effect for Buttons */
    .shimmer-btn {
      background: linear-gradient(90deg, #d97706 0%, #fef08a 50%, #d97706 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    /* Particle Overlay Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans relative">

  <!-- Floating Golden Particles Canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Divine Radial Light Layer -->
  <div class="god-ray fixed inset-0 pointer-events-none z-0"></div>

  <!-- GATEWAY SCREEN (Initial View for 7 Seconds) -->
  <div id="gateway-screen" class="relative z-20 h-full w-full flex flex-col items-center justify-between p-6 transition-all duration-1000">
    
    <!-- Top Branding -->
    <div class="text-center pt-6 animate-float-slow">
      <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-700 shadow-2xl shadow-amber-500/40 border border-amber-200/50 mb-3 animate-pulse-glow">
        <i class="fa-solid fa-cross text-3xl sm:text-4xl text-slate-950"></i>
      </div>
      
      <!-- Region Title -->
      <p class="font-ml font-bold text-amber-300 text-lg sm:text-2xl tracking-wider uppercase mb-1">
        പയ്യമ്പള്ളി മേഖല
      </p>

      <!-- Main Event Title -->
      <h1 class="font-ml font-extrabold text-3xl sm:text-5xl tracking-wide gold-gradient-text">
        കലാമത്സരം 2026
      </h1>

      <p class="text-xs sm:text-sm text-amber-200/90 font-medium tracking-widest uppercase mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-dove text-amber-400"></i> Live Scoreboard Portal
      </p>
    </div>

    <!-- Center Gateway Card & Countdown Circle -->
    <div class="divine-glass max-w-md w-full p-6 sm:p-8 rounded-3xl text-center space-y-6 relative overflow-hidden my-auto border border-amber-500/40">
      
      <!-- Scripture Box -->
      <div class="bg-slate-900/90 border border-amber-500/20 rounded-2xl p-4 text-left relative">
        <i class="fa-solid fa-quote-left text-amber-500/20 text-3xl absolute top-2 right-3"></i>
        <p id="gateway-quote" class="text-xs sm:text-sm font-serif italic text-amber-100 transition-opacity duration-500 relative z-10 leading-relaxed">
          "I can do all this through him who gives me strength."
        </p>
        <span id="gateway-ref" class="text-[11px] font-bold text-amber-400 tracking-wider block mt-2 text-right">
          — Philippians 4:13
        </span>
      </div>

      <!-- 7-Second Countdown Display -->
      <div class="flex flex-col items-center justify-center space-y-3">
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90">
            <circle cx="50%" cy="50%" r="40%" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="transparent" />
            <circle id="countdown-circle" cx="50%" cy="50%" r="40%" stroke="#f59e0b" stroke-width="6" fill="transparent" 
                    stroke-dasharray="250" stroke-dashoffset="0" class="transition-all duration-1000 ease-linear" />
          </svg>
          <span id="timer-text" class="absolute font-serif text-3xl sm:text-4xl font-black text-amber-400">7</span>
        </div>
        <p class="text-xs font-semibold tracking-widest text-slate-300 font-ml">
          തത്സമയ സ്‌കോർബോർഡിലേക്ക് ബന്ധിപ്പിക്കുന്നു...
        </p>
      </div>

      <!-- Manual Skip Button -->
      <button onclick="skipGateway()" class="w-full py-3 rounded-xl font-bold text-xs uppercase tracking-wider text-slate-950 shimmer-btn shadow-lg shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span>Connect Instantly</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </div>

    <!-- Footer -->
    <div class="text-center pb-4 text-[11px] text-slate-500 tracking-wider uppercase font-ml">
      പയ്യമ്പള്ളി മേഖല • കലാമത്സരം 2026
    </div>

  </div>

  <!-- MAIN SCOREBOARD VIEW (Revealed After 7 Seconds) -->
  <div id="main-app" class="relative z-10 h-full w-full flex flex-col hidden opacity-0 transition-opacity duration-1000 p-2 sm:p-3">

    <!-- IFRAME CONTAINER (Full Height & Clean View) -->
    <main class="flex-1 w-full h-full relative">
      <div class="w-full h-full divine-glass rounded-2xl overflow-hidden border border-amber-500/30 shadow-2xl relative flex flex-col">
        
        <!-- Loading Overlay for Iframe -->
        <div id="iframe-loader" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-20 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
          <div class="w-12 h-12 mb-4 rounded-full border-2 border-amber-500/20 border-t-amber-400 animate-spin"></div>
          <p class="font-ml text-base font-bold text-amber-200">തത്സമയ സ്‌കോർബോർഡ് ലോഡ് ചെയ്യുന്നു...</p>
        </div>

        <iframe 
          id="live-frame"
          src="" 
          class="w-full h-full border-0 flex-1 bg-transparent"
          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"
          onload="hideIframeLoader()">
        </iframe>

      </div>
    </main>

  </div>

  <!-- SCRIPT ENGINE -->
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwH4GVY_sRKmIH5C6o6cnqnIqeGTDUJBrYECB43IGjEwbj8CL4Nb3nIiA00tcPngcjUww/exec";

    // BIBLE QUOTES ROTATOR
    const bibleQuotes = [
      { q: "I can do all this through him who gives me strength.", r: "Philippians 4:13" },
      { q: "The Lord is my shepherd, I lack nothing.", r: "Psalm 23:1" },
      { q: "Trust in the Lord with all your heart and lean not on your own understanding.", r: "Proverbs 3:5" },
      { q: "For I know the plans I have for you, declares the Lord, plans to prosper you.", r: "Jeremiah 29:11" },
      { q: "Be strong and courageous. Do not be afraid; do not be discouraged.", r: "Joshua 1:9" },
      { q: "The Lord is my light and my salvation—whom shall I fear?", r: "Psalm 27:1" },
      { q: "And we know that in all things God works for the good of those who love him.", r: "Romans 8:28" },
      { q: "Love is patient, love is kind. It does not envy, it does not boast.", r: "1 Corinthians 13:4" },
      { q: "Those who hope in the Lord will renew their strength. They will soar on wings like eagles.", r: "Isaiah 40:31" },
      { q: "God is our refuge and strength, an ever-present help in trouble.", r: "Psalm 46:1" },
      { q: "In the beginning was the Word, and the Word was with God, and the Word was God.", r: "John 1:1" },
      { q: "For God so loved the world that he gave his one and only Son.", r: "John 3:16" },
      { q: "The light shines in the darkness, and the darkness has not overcome it.", r: "John 1:5" },
      { q: "Delight yourself in the Lord, and he will give you the desires of your heart.", r: "Psalm 37:4" },
      { q: "Give thanks to the Lord, for he is good; his love endures forever.", r: "Psalm 107:1" }
    ];

    let currentQuoteIdx = 0;
    let countdownValue = 7;
    let timerInterval = null;
    let isConnected = false;

    // Countdown and Gateway Handler
    function startGatewayCountdown() {
      const circle = document.getElementById('countdown-circle');
      const text = document.getElementById('timer-text');
      const totalDash = 250;

      timerInterval = setInterval(() => {
        countdownValue--;
        text.innerText = countdownValue;
        
        const offset = totalDash - (totalDash * (7 - countdownValue) / 7);
        circle.style.strokeDashoffset = offset;

        if (countdownValue <= 0) {
          clearInterval(timerInterval);
          connectToScoreboard();
        }
      }, 1000);
    }

    function skipGateway() {
      if (timerInterval) clearInterval(timerInterval);
      connectToScoreboard();
    }

    function connectToScoreboard() {
      if (isConnected) return;
      isConnected = true;

      const gateway = document.getElementById('gateway-screen');
      const mainApp = document.getElementById('main-app');
      const frame = document.getElementById('live-frame');

      // Load iframe src
      frame.src = GOOGLE_SCRIPT_URL;

      // Smooth Fade Out Gateway and Fade In Main App
      gateway.style.opacity = '0';
      setTimeout(() => {
        gateway.classList.add('hidden');
        mainApp.classList.remove('hidden');
        setTimeout(() => {
          mainApp.style.opacity = '1';
        }, 50);
      }, 700);
    }

    // Quote Rotator
    function rotateQuote() {
      currentQuoteIdx = (currentQuoteIdx + 1) % bibleQuotes.length;
      const gQ = document.getElementById('gateway-quote');
      const gR = document.getElementById('gateway-ref');

      if (gQ && gR) {
        gQ.style.opacity = '0';
        gR.style.opacity = '0';

        setTimeout(() => {
          gQ.innerText = `"${bibleQuotes[currentQuoteIdx].q}"`;
          gR.innerText = `— ${bibleQuotes[currentQuoteIdx].r}`;
          gQ.style.opacity = '1';
          gR.style.opacity = '1';
        }, 500);
      }
    }

    setInterval(rotateQuote, 6000);

    function hideIframeLoader() {
      const loader = document.getElementById('iframe-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 700);
      }
    }

    // GOLDEN PARTICLES BACKGROUND ANIMATION
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.opacity = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < 0) {
          this.y = canvas.height;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(251, 191, 36, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }

    // Initialize Gateway
    window.onload = function() {
      startGatewayCountdown();
      animateParticles();
    };
  </script>
</body>
</html>
