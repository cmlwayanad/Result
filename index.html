<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b14" />
  <title>Competition Status</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.14), transparent 32%),
        radial-gradient(circle at 80% 30%, rgba(168, 85, 247, 0.18), transparent 34%),
        radial-gradient(circle at 50% 85%, rgba(34, 197, 94, 0.10), transparent 30%),
        linear-gradient(135deg, #050816 0%, #0a0f1f 55%, #080b14 100%);
      color: #fff;
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 95%);
      z-index: -2;
    }

    .glow {
      position: absolute;
      width: min(62vw, 720px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        rgba(56, 189, 248, .24),
        rgba(168, 85, 247, .22),
        rgba(34, 197, 94, .16),
        rgba(56, 189, 248, .24)
      );
      filter: blur(80px);
      opacity: .52;
      animation: float 8s ease-in-out infinite alternate;
      z-index: -3;
    }

    .card {
      width: min(92vw, 900px);
      padding: clamp(32px, 6vw, 72px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.035));
      box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.09);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        transparent 15%,
        rgba(255,255,255,.07) 42%,
        transparent 68%
      );
      transform: translateX(-100%);
      animation: sheen 5.5s ease-in-out infinite;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 5.8rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 800;
      text-wrap: balance;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #dff7ff 28%,
        #d8c7ff 58%,
        #d5ffe3 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 30px rgba(255,255,255,.08));
    }

    @keyframes float {
      from { transform: translate3d(-4%, -3%, 0) scale(.95) rotate(0deg); }
      to   { transform: translate3d(4%, 4%, 0) scale(1.06) rotate(18deg); }
    }

    @keyframes sheen {
      0%, 70% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .card {
        width: 100%;
        min-height: 42vh;
        display: grid;
        place-items: center;
        padding: 28px 22px;
        border-radius: 24px;
      }

      h1 {
        font-size: clamp(2.1rem, 12vw, 4rem);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .glow {
        width: 110vw;
        opacity: .44;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow,
      .card::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="card">
    <h1>All Competition Completed</h1>
  </main>
</body>
</html>
